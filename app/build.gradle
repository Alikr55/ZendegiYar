plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zendegiyar.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zendegiyar.app'
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName "8.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
